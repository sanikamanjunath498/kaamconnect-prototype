<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaamConnect — Voice-First Job Matching & Skill Passport</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            cream: '#F5EFE0',
            navy: {
              DEFAULT: '#1B1F6B',
              light: '#2A308C',
              dark: '#12154D',
              soft: '#EEF0FA',
            },
            brandOrange: {
              DEFAULT: '#C2410C',
              hover: '#9A3412',
              soft: '#FFF3ED',
            },
            softGrey: '#64748B',
            slateText: '#475569',
          },
        },
      },
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F5EFE0;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E293B;
    }

    /* Realistic Phone Frame (390x844) */
    .phone-frame {
      width: 390px;
      height: 844px;
      max-width: 100vw;
      max-height: 100vh;
      background: #F8FAFC;
      border-radius: 46px;
      box-shadow:
        0 25px 60px -15px rgba(27, 31, 107, 0.25),
        0 0 0 11px #18181B,
        0 0 0 13px #3F3F46;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 420px) {
      .phone-frame {
        border-radius: 0;
        box-shadow: none;
        width: 100vw;
        height: 100dvh;
      }
    }

    /* Custom subtle scrollbar */
    .scroll-area::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .scroll-area::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.25);
      border-radius: 9999px;
    }

    /* Screen Transitions */
    .screen-view {
      animation: screenFadeSlide 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes screenFadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Pop-in animation for chips */
    .chip-pop {
      animation: chipPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes chipPopIn {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(6px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Waveform Bars Animation */
    .wave-bar {
      animation: soundWave 0.7s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(1) { animation-delay: 0.05s; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.35s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { animation-delay: 0.25s; }
    .wave-bar:nth-child(6) { animation-delay: 0.4s; }
    .wave-bar:nth-child(7) { animation-delay: 0.15s; }
    .wave-bar:nth-child(8) { animation-delay: 0.3s; }
    .wave-bar:nth-child(9) { animation-delay: 0.08s; }

    @keyframes soundWave {
      0% { transform: scaleY(0.28); }
      100% { transform: scaleY(1); }
    }

    /* Pulse ring for mic button */
    .mic-pulse {
      animation: micPulseRing 1.8s infinite;
    }

    @keyframes micPulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(194, 65, 12, 0.45);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(194, 65, 12, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(194, 65, 12, 0);
      }
    }

    /* Bouncing thinking dots */
    .dot-bounce {
      animation: dotBounce 1.2s infinite ease-in-out both;
    }
    .dot-bounce:nth-child(1) { animation-delay: -0.32s; }
    .dot-bounce:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Centered 390x844 Phone Frame -->
  <div class="phone-frame" id="app-frame">
    
    <!-- Top iOS-style Status Bar & Dynamic Notch -->

        </svg>
      </div>
    </div>

    <!-- Persistent App Header -->
    <header class="bg-[#1B1F6B] text-white px-4 py-3 flex items-center justify-between shadow-md shrink-0 z-20">
      <button onclick="navigateTo('chat')" class="flex items-center gap-2.5 text-left focus:outline-none active:scale-95 transition-transform">
        <div class="w-9 h-9 rounded-xl bg-[#C2410C] flex items-center justify-center shadow-inner border border-orange-400/30">
          <!-- Voice + Bolt Icon -->
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>

        </div>
        <div>
          <h1 class="text-base font-bold leading-tight tracking-tight">KaamConnect</h1>
          <p class="text-[10px] text-indigo-200 font-medium leading-none mt-0.5">Bol kar kaam paayein</p>
        </div>
      </button>

      <!-- Visual Language Chip (Cycles on tap) -->
      <button
        id="lang-chip"
        onclick="cycleLanguage()"
        class="bg-white/15 hover:bg-white/25 active:scale-95 transition-all border border-white/25 rounded-full px-3 py-1.5 flex items-center gap-1.5 text-xs font-semibold text-white shadow-sm"
        title="Tap to switch display language label"

        <svg class="w-3.5 h-3.5 text-orange-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

          <path d="M2 12h20"/>

    </header>

    <!-- Main Scrollable Screen Container -->
    <main id="main-content" class="flex-1 overflow-y-auto scroll-area relative bg-[#F8FAFC]">
      <!-- Dynamic Screen Content Injected Here -->
    </main>

    <!-- Persistent Bottom Tab Bar -->
    <nav class="bg-white border-t border-slate-200 px-2 py-2 pb-4 grid grid-cols-4 gap-1 shrink-0 z-20 shadow-[0_-4px_16px_rgba(0,0,0,0.04)]">
      <button
        id="tab-chat"
        onclick="navigateTo('chat')"
        class="nav-tab flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all active:scale-95"
      >
        <div class="w-7 h-7 flex items-center justify-center rounded-xl mb-0.5 tab-icon-wrap">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="text-[11px] font-semibold">Chat</span>
      </button>

      <button
        id="tab-jobs"
        onclick="navigateTo('jobs')"
        class="nav-tab flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all active:scale-95 relative"
      >
        <div class="w-7 h-7 flex items-center justify-center rounded-xl mb-0.5 tab-icon-wrap relative">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span class="absolute -top-1 -right-2 bg-[#1B1F6B] text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">3</span>

      <button

        onclick="navigateTo('passport')"

        <div class="w-7 h-7 flex items-center justify-center rounded-xl mb-0.5 tab-icon-wrap">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      <button

        onclick="navigateTo('alerts')"

      >
        <div class="w-7 h-7 flex items-center justify-center rounded-xl mb-0.5 tab-icon-wrap relative">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

          <span id="alerts-badge" class="absolute -top-1 -right-1.5 bg-[#C2410C] text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow-sm">2</span>
        </div>
        <span class="text-[11px] font-semibold">Alerts</span>
      </button>
    </nav>

    <!-- In-App Modal / Toast Overlay Container -->
    <div id="overlay-modal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] z-50 flex items-end sm:items-center justify-center p-4">
      <div id="overlay-card" class="bg-white w-full rounded-3xl p-5 shadow-2xl border border-slate-100 screen-view">
        <!-- Dynamic modal content -->
      </div>
    </div>

    <!-- Bottom Toast Banner -->
    <div id="toast-banner" class="hidden absolute bottom-24 left-4 right-4 bg-[#1B1F6B] text-white px-4 py-3 rounded-2xl shadow-xl z-40 flex items-center gap-3 text-xs font-medium transition-all">
      <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-300 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <span id="toast-text" class="flex-1">Action completed</span>
    </div>

  </div>

  <script>
    // ==========================================
    // HARDCODED SAMPLE DATA & APP STATE
    // ==========================================
    const LANGUAGES = ['English', 'हिन्दी', 'ಕನ್ನಡ'];

    const WORKER_PROFILE = {

    // Jobs pre-sorted by distance (2.1 km, 3.2 km, 4.5 km)

      {

          scamChecks: [

      {

        employer: {
          name: 'Sharma Hardware',
          verified: true,
          rating: 4.6,

          memberSince: '2022',
          phone: '+91 98501 •••89',
          scamChecks: [
            { label: 'Identity verified', passed: true, detail: 'GST & shop license verified' },
            { label: 'Payment history', passed: true, detail: '28/28 workers paid on time' },
            { label: 'No advance fee', passed: true, detail: 'Direct cash or UPI after work' }
          ]
        }
      },
      {
        id: 'job-3',
        title: 'Shop fitting',
        area: 'Baner',
        distanceKm: 4.5,
        distanceLabel: '4.5 km',
        pay: 400,
        payLabel: 'Rs 400/day',
        marketRate: 'Rs 850–950',
        wageStatus: 'Below market',
        isFair: false,
        timing: 'Tomorrow, 9:00 AM',
        duration: '3 days',
        employer: {
          name: 'QuickHire Services',
          verified: false,
          rating: 2.1,
          jobsPosted: 0,
          memberSince: 'Nov 2026',
          unverifiedReasons: ['New account', 'Asks advance fee', 'No past jobs'],
          scamChecks: [
            { label: 'Identity verified', passed: false, detail: 'Unverified new account (Nov 2026)' },
            { label: 'Payment history', passed: false, detail: 'No past jobs completed on platform' },
            { label: 'No advance fee', passed: false, detail: 'Warning: Asks Rs 200 advance fee' }
          ]
        }
      }
    ];

    // App Interactive State
    const state = {
      currentScreen: 'chat', // 'chat' | 'jobs' | 'trust' | 'confirmed' | 'passport' | 'alerts'
      langIndex: 0,
      chatStep: 'idle', // 'idle' | 'recording' | 'analyzing' | 'done'
      recordingSeconds: 3,
      selectedJobId: 'job-1',
      reportedEmployers: {},
      acceptedJobs: {},
      urgentAlertStatus: 'pending', // 'pending' | 'accepted' | 'skipped'
      teamJoined: false
    };

    let activeTimers = [];

    function clearTimers() {
      activeTimers.forEach(t => clearTimeout(t));
      activeTimers.forEach(t => clearInterval(t));
      activeTimers = [];
    }

    // ==========================================
    // NAVIGATION & GLOBAL CONTROLS
    // ==========================================
    function cycleLanguage() {
      state.langIndex = (state.langIndex + 1) % LANGUAGES.length;
      const chipLabel = document.getElementById('lang-label');
      chipLabel.textContent = LANGUAGES[state.langIndex];
      showToast(`Language display: ${LANGUAGES[state.langIndex]}`);
    }

    function navigateTo(screen, jobId = null) {
      if (jobId) {
        state.selectedJobId = jobId;
      }
      state.currentScreen = screen;
      updateTabBar();
      renderScreen();
      document.getElementById('main-content').scrollTop = 0;
    }

    function updateTabBar() {
      const tabs = ['chat', 'jobs', 'passport', 'alerts'];
      const activeTab = (state.currentScreen === 'trust' || state.currentScreen === 'confirmed')
        ? 'jobs'
        : state.currentScreen;

      tabs.forEach(tab => {
        const el = document.getElementById(`tab-${tab}`);
        const iconWrap = el.querySelector('.tab-icon-wrap');
        if (tab === activeTab) {
          el.classList.add('text-[#1B1F6B]');
          el.classList.remove('text-[#64748B]');
          iconWrap.classList.add('bg-[#EEF0FA]', 'text-[#1B1F6B]');
        } else {
          el.classList.remove('text-[#1B1F6B]');
          el.classList.add('text-[#64748B]');
          iconWrap.classList.remove('bg-[#EEF0FA]', 'text-[#1B1F6B]');
        }
      });

      const badge = document.getElementById('alerts-badge');
      if (badge) {
        const count = (state.urgentAlertStatus === 'pending' ? 1 : 0) + (state.teamJoined ? 0 : 1);
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast-banner');
      const text = document.getElementById('toast-text');
      text.textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2600);
    }

    function closeModal() {
      document.getElementById('overlay-modal').classList.add('hidden');
    }

    function openModal(htmlContent) {
      const modal = document.getElementById('overlay-modal');
      const card = document.getElementById('overlay-card');
      card.innerHTML = htmlContent;
      modal.classList.remove('hidden');
    }

    function renderFooter() {
      return `
        <footer class="pt-5 pb-4 text-center">
          <span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-[#64748B] bg-slate-200/60 px-3 py-1 rounded-full">
            <span class="w-1.5 h-1.5 rounded-full bg-[#1B1F6B]"></span>
            Prototype with sample data
          </span>
        </footer>
      `;
    }

    // ==========================================
    // SCREEN 1: VOICE ONBOARDING (CHAT)
    // ==========================================
    function startVoiceRecording() {
      if (state.chatStep === 'recording' || state.chatStep === 'analyzing') return;
      clearTimers();

      state.chatStep = 'recording';
      state.recordingSeconds = 3;
      renderScreen();

      const countdown = setInterval(() => {
        state.recordingSeconds -= 1;
        const timerEl = document.getElementById('rec-timer');
        if (timerEl && state.recordingSeconds >= 0) {
          timerEl.textContent = `0:0${state.recordingSeconds}`;
        }
      }, 1000);
      activeTimers.push(countdown);

      const t1 = setTimeout(() => {
        clearInterval(countdown);
        state.chatStep = 'analyzing';
        renderScreen();
        scrollChatBottom();

        const t2 = setTimeout(() => {
          state.chatStep = 'done';
          renderScreen();
          scrollChatBottom();
        }, 1500);
        activeTimers.push(t2);
      }, 3000);
      activeTimers.push(t1);
    }

    function resetVoiceChat() {
      clearTimers();
      state.chatStep = 'idle';
      state.recordingSeconds = 3;
      renderScreen();
    }

    function scrollChatBottom() {
      const container = document.getElementById('main-content');
      if (container) {
        setTimeout(() => {
          container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }, 60);
      }
    }

    function renderChatScreen() {
      const step = state.chatStep;

      return `
        <div class="min-h-full flex flex-col justify-between bg-[#ECE5DD]/55 px-3.5 pt-4 pb-2 screen-view">
          <!-- Chat Messages Thread -->
          <div class="space-y-3.5">
            <!-- Date Pill -->
            <div class="flex justify-center">
              <span class="bg-white/90 text-[#64748B] text-[11px] font-semibold px-3 py-1 rounded-full shadow-xs border border-slate-200/70">
                Today • Voice Assistant
              </span>
            </div>

            <!-- Bot Welcome Message -->
            <div class="flex items-end gap-2 max-w-[88%]">
              <div class="w-8 h-8 rounded-full bg-[#1B1F6B] text-white flex items-center justify-center shrink-0 shadow-xs">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                </svg>
              </div>
              <div class="bg-white rounded-2xl rounded-bl-sm p-3.5 shadow-sm border border-slate-100">

                  <rect x="48" y="48" width="8" height="8"/>
                </svg>
              </div>
              <div class="flex-1">
                <h4 class="text-sm font-extrabold text-slate-900">Passport ID #KC-4092</h4>
                <p class="text-[11px] text-[#64748B] leading-snug mt-0.5">
                  Employers can scan this QR code to verify your work history instantly.
                </p>
              </div>
            </div>

            <button
              onclick="openSharePassportModal()"
              class="w-full bg-[#C2410C] hover:bg-[#9A3412] active:scale-[0.98] transition-all text-white font-bold py-3.5 px-4 rounded-2xl shadow-md flex items-center justify-center gap-2 text-sm"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
              Share passport
            </button>

            <!-- Data Ownership Note -->
            <div class="bg-[#F5EFE0] rounded-2xl px-3 py-2.5 flex items-center justify-center gap-2 text-[11px] font-semibold text-[#1B1F6B]">
              <svg class="w-4 h-4 text-[#C2410C] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <span>You own this data. You decide who sees it.</span>
            </div>
          </div>

          ${renderFooter()}
        </div>
      `;
    }

    // ==========================================
    // SCREEN 5: ALERTS & TEAM HIRING
    // ==========================================
    function setUrgentAlert(status) {
      state.urgentAlertStatus = status;
      updateTabBar();
      renderScreen();
      if (status === 'accepted') {
        showToast('Urgent alert accepted! Details sent.');
      } else if (status === 'skipped') {
        showToast('Urgent alert skipped.');
      }
    }

    function toggleTeamJoin() {
      state.teamJoined = !state.teamJoined;
      updateTabBar();
      renderScreen();
      if (state.teamJoined) {
        showToast('Team hiring request accepted!');
      }
    }

    function renderAlertsScreen() {
      const alertStatus = state.urgentAlertStatus;

      return `
        <div class="px-4 pt-4 pb-2 space-y-4 screen-view">
          <div>
            <h2 class="text-base font-extrabold text-[#1B1F6B]">Live Alerts & Team Requests</h2>
            <p class="text-xs text-[#64748B]">Instant nearby dispatch & multi-worker crew jobs</p>
          </div>

          <!-- Push-Style Urgent Alert Card -->
          <div class="bg-white rounded-3xl p-4 shadow-md border-2 ${alertStatus === 'accepted' ? 'border-emerald-400' : 'border-orange-300'} relative overflow-hidden">
            <div class="flex items-center justify-between mb-2.5">
              <span class="inline-flex items-center gap-1.5 bg-red-600 text-white text-[10.5px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full">

              </span>

                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
              </div>
              <div class="flex-1">
                <h3 class="text-[14.5px] font-extrabold text-slate-900 leading-snug">
                  Urgent: Plumber needed in 2 hours, 1.8 km away, Rs 1,000
                </h3>
                <p class="text-xs text-[#64748B] mt-1">
                  Verified homeowner • Deccan Gymkhana • Instant UPI pay
                </p>
              </div>
            </div>

            ${alertStatus === 'pending' ? `
              <div class="grid grid-cols-2 gap-2.5 mt-4">
                <button
                  onclick="setUrgentAlert('accepted')"
                  class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-bold py-3 rounded-2xl text-sm shadow-sm flex items-center justify-center gap-1.5"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                  Accept
                </button>
                <button
                  onclick="setUrgentAlert('skipped')"
                  class="bg-slate-100 hover:bg-slate-200 active:scale-95 transition-all text-slate-700 font-bold py-3 rounded-2xl text-sm flex items-center justify-center gap-1.5"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                  Skip
                </button>
              </div>
            ` : alertStatus === 'accepted' ? `
              <div class="mt-3.5 bg-emerald-50 border border-emerald-200 rounded-2xl p-3 flex items-center justify-between">
                <span class="text-xs font-bold text-emerald-800">Accepted! Shared with your plumber buddy.</span>
                <button onclick="setUrgentAlert('pending')" class="text-[11px] font-bold text-[#1B1F6B] underline">Undo</button>
              </div>
            ` : `
              <div class="mt-3.5 bg-slate-100 rounded-2xl p-3 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-600">Alert skipped</span>
                <button onclick="setUrgentAlert('pending')" class="text-[11px] font-bold text-[#1B1F6B] underline">Undo</button>
              </div>
            `}
          </div>

          <!-- Team Hiring Card -->
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/90 space-y-3.5">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="inline-flex items-center gap-1 bg-[#EEF0FA] text-[#1B1F6B] text-[10.5px] font-extrabold uppercase tracking-wide px-2.5 py-1 rounded-full mb-1.5">
                  <svg class="w-3.5 h-3.5 text-[#C2410C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                  Team Hiring
                </span>
                <h3 class="text-sm font-extrabold text-slate-900">Mason + Helper + Painter</h3>
                <p class="text-xs text-[#64748B] font-medium">Patil Builders • Wakad • 1 combined request</p>
              </div>
              <div class="text-right">
                <span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-200 block">
                  Rs 2,400/day
                </span>
                <span class="text-[10px] text-[#64748B] mt-0.5 block">Total crew pay</span>
              </div>
            </div>

            <!-- Three Small Slots Showing Matched Workers -->
            <div class="grid grid-cols-3 gap-2 pt-1">
              <!-- Slot 1: Mason -->
              <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-2.5 text-center">
                <div class="w-9 h-9 rounded-full bg-[#1B1F6B] text-white font-bold text-xs flex items-center justify-center mx-auto mb-1.5">
                  SM
                </div>
                <span class="inline-block bg-orange-100 text-[#C2410C] text-[9.5px] font-extrabold px-2 py-0.5 rounded-full mb-1">
                  Mason
                </span>
                <p class="text-[11px] font-bold text-slate-900 truncate">Suresh M.</p>
                <p class="text-[10px] text-emerald-700 font-semibold">4.8 ★ Verified</p>
              </div>

              <!-- Slot 2: Helper -->
              <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-2.5 text-center">
                <div class="w-9 h-9 rounded-full bg-[#1B1F6B] text-white font-bold text-xs flex items-center justify-center mx-auto mb-1.5">
                  DR
                </div>
                <span class="inline-block bg-indigo-100 text-[#1B1F6B] text-[9.5px] font-extrabold px-2 py-0.5 rounded-full mb-1">
                  Helper
                </span>
                <p class="text-[11px] font-bold text-slate-900 truncate">Deepak R.</p>
                <p class="text-[10px] text-emerald-700 font-semibold">4.6 ★ Verified</p>
              </div>

              <!-- Slot 3: Painter -->
              <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-2.5 text-center">
                <div class="w-9 h-9 rounded-full bg-[#1B1F6B] text-white font-bold text-xs flex items-center justify-center mx-auto mb-1.5">
                  AK
                </div>
                <span class="inline-block bg-emerald-100 text-emerald-800 text-[9.5px] font-extrabold px-2 py-0.5 rounded-full mb-1">
                  Painter
                </span>
                <p class="text-[11px] font-bold text-slate-900 truncate">Anwar K.</p>
                <p class="text-[10px] text-emerald-700 font-semibold">4.9 ★ Verified</p>
              </div>
            </div>

            <button
              onclick="toggleTeamJoin()"
              class="w-full ${state.teamJoined ? 'bg-emerald-600 text-white' : 'bg-[#1B1F6B] hover:bg-[#12154D] text-white'} active:scale-[0.98] transition-all font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-xs"
            >
              ${state.teamJoined ? `
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                Team Crew Confirmed (3/3 Ready)
              ` : `
                Confirm Team Crew (3/3 Matched)
              `}
            </button>
          </div>

          ${renderFooter()}
        </div>
      `;
    }

    // ==========================================
    // MAIN RENDER CONTROLLER
    // ==========================================
    function renderScreen() {
      const container = document.getElementById('main-content');
      switch (state.currentScreen) {
        case 'chat':
          container.innerHTML = renderChatScreen();
          break;
        case 'jobs':
          container.innerHTML = renderJobsScreen();
          break;
        case 'trust':
          container.innerHTML = renderTrustScreen();
          break;
        case 'confirmed':
          container.innerHTML = renderConfirmedScreen();
          break;
        case 'passport':
          container.innerHTML = renderPassportScreen();
          break;
        case 'alerts':
          container.innerHTML = renderAlertsScreen();
          break;
        default:
          container.innerHTML = renderChatScreen();
      }
    }

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      updateTabBar();
      renderScreen();
    });
  </script>
</body>
</html>
